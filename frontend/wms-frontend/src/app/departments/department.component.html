<div class="min-h-screen bg-gray-100 p-6">
  <div class="max-w-4xl mx-auto">
    <button (click)="goBack()" class="text-blue-600 text-sm mb-1 hover:underline">← Back to Dashboard</button>
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">Departments</h2>
      <button (click)="showForm = !showForm" class="bg-blue-700 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-800">
        + Add Department
      </button>
    </div>

    <div *ngIf="message" class="bg-blue-50 text-blue-700 p-3 rounded-lg mb-4 text-sm">{{ message }}</div>

    <div *ngIf="showForm" class="bg-white rounded-xl shadow p-6 mb-6">
      <h3 class="font-semibold text-gray-700 mb-4">New Department</h3>
      <div class="grid grid-cols-2 gap-4">
        <input [(ngModel)]="newDepartment.departmentName" placeholder="Department Name" class="border rounded-lg px-3 py-2 text-sm"/>
        <input [(ngModel)]="newDepartment.description" placeholder="Description" class="border rounded-lg px-3 py-2 text-sm"/>
      </div>
      <div class="flex gap-3 mt-4">
        <button (click)="createDepartment()" class="bg-blue-700 text-white px-4 py-2 rounded-lg text-sm">Save</button>
        <button (click)="showForm = false" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm">Cancel</button>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
          <tr>
            <th class="px-4 py-3 text-left">Department Name</th>
            <th class="px-4 py-3 text-left">Description</th>
            <th class="px-4 py-3 text-left">Created On</th>
            <th class="px-4 py-3 text-left">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let d of departments" class="border-t hover:bg-gray-50">
            <td class="px-4 py-3 font-medium">{{ d.departmentName }}</td>
            <td class="px-4 py-3 text-gray-500">{{ d.description }}</td>
            <td class="px-4 py-3">{{ d.createdOn | date:'mediumDate' }}</td>
            <td class="px-4 py-3">
              <button (click)="deleteDepartment(d.departmentId)" class="text-red-500 hover:text-red-700 text-xs">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
