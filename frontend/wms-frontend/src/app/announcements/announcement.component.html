<div class="min-h-screen bg-gray-100 p-6">
  <div class="max-w-4xl mx-auto">
    <button (click)="goBack()" class="text-blue-600 text-sm mb-1 hover:underline">← Back to Dashboard</button>
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">📢 Announcements</h2>
      <button *ngIf="role === 'Admin'" (click)="showForm = !showForm"
        class="bg-blue-700 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-800">
        + Post Announcement
      </button>
    </div>

    <div *ngIf="message" class="bg-blue-50 text-blue-700 p-3 rounded-lg mb-4 text-sm">{{ message }}</div>

    <!-- Create Form (Admin only) -->
    <div *ngIf="showForm && role === 'Admin'" class="bg-white rounded-xl shadow p-6 mb-6">
      <h3 class="font-semibold text-gray-700 mb-4">New Announcement</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Title *</label>
          <input [(ngModel)]="newAnnouncement.title" placeholder="Enter announcement title"
            class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Message *</label>
          <textarea [(ngModel)]="newAnnouncement.message" placeholder="Enter announcement message" rows="4"
            class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
      </div>
      <div class="flex gap-3 mt-4">
        <button (click)="create()" class="bg-blue-700 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-800">Post</button>
        <button (click)="showForm = false" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm">Cancel</button>
      </div>
    </div>

    <!-- Announcements List -->
    <div class="space-y-4">
      <div *ngFor="let a of announcements" class="bg-white rounded-xl shadow p-6 border-l-4 border-blue-500">
        <div class="flex justify-between items-start">
          <div class="flex-1">
            <h3 class="font-semibold text-gray-800 text-lg">{{ a.title }}</h3>
            <p class="text-gray-600 mt-2 text-sm leading-relaxed">{{ a.message }}</p>
            <p class="text-gray-400 text-xs mt-3">Posted on {{ a.createdOn | date:'medium' }}</p>
          </div>
          <button *ngIf="role === 'Admin'" (click)="delete(a.announcementId)"
            class="text-red-400 hover:text-red-600 text-xs ml-4">Delete</button>
        </div>
      </div>
      <div *ngIf="announcements.length === 0"
        class="bg-white rounded-xl shadow p-8 text-center text-gray-400">
        No announcements yet
      </div>
    </div>
  </div>
</div>
