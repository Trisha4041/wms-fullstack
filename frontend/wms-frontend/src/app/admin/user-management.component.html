<div class="min-h-screen bg-gray-100 p-6">
  <div class="max-w-md mx-auto">
    <button (click)="goBack()" class="text-blue-600 text-sm mb-2 hover:underline">← Back to Dashboard</button>
    <h2 class="text-2xl font-bold text-gray-800 mb-6">User Management</h2>

    <div class="bg-white rounded-xl shadow p-6">
      <h3 class="font-semibold text-gray-700 mb-4">Register New User</h3>

      <div *ngIf="message" [class]="isError ? 'bg-red-50 text-red-600 p-3 rounded mb-4 text-sm' : 'bg-green-50 text-green-600 p-3 rounded mb-4 text-sm'">
        {{ message }}
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input [(ngModel)]="newUser.username" placeholder="Enter username"
            class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input [(ngModel)]="newUser.password" type="password" placeholder="Enter password"
            class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
          <select [(ngModel)]="newUser.roleId" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option [value]="1">Admin</option>
            <option [value]="2">Manager</option>
            <option [value]="3">Employee</option>
          </select>
        </div>
        <button (click)="register()" class="w-full bg-blue-700 text-white py-2 rounded-lg text-sm hover:bg-blue-800">
          Register User
        </button>
      </div>
    </div>
  </div>
</div>
