<div class="min-h-screen bg-gradient-to-br from-blue-900 to-blue-700 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">

    <div class="text-center mb-8">
      <div class="bg-blue-700 text-white rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
        WMS
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Workforce Management</h1>
      <p class="text-gray-500 text-sm mt-1">Sign in to your account</p>
    </div>

    <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-600 rounded-lg p-3 mb-4 text-sm">
      {{ errorMessage }}
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" [(ngModel)]="username" placeholder="Enter your username"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" [(ngModel)]="password" placeholder="Enter your password"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <button (click)="onLogin()" [disabled]="isLoading"
        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg transition duration-200 disabled:opacity-50">
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>

      <div class="text-center">
        <span class="text-sm text-gray-500">Don't have an account? </span>
        <a href="/register" class="text-blue-600 hover:underline font-medium text-sm">Register here</a>
      </div>

    </div>

    <p class="text-center text-gray-400 text-xs mt-6">
      Workforce Management System v1.0
    </p>
  </div>
</div>
