<div class="min-h-screen bg-gradient-to-br from-blue-900 to-blue-700 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">

    <div class="text-center mb-8">
      <div class="bg-blue-700 text-white rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
        WMS
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Create Account</h1>
      <p class="text-gray-500 text-sm mt-1">Register to access the system</p>
    </div>

    <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-600 rounded-lg p-3 mb-4 text-sm">
      {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="bg-green-50 border border-green-200 text-green-600 rounded-lg p-3 mb-4 text-sm">
      {{ successMessage }}
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" [(ngModel)]="username" placeholder="Enter username"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" [(ngModel)]="password" placeholder="Enter password"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
        <input type="password" [(ngModel)]="confirmPassword" placeholder="Confirm password"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Register As</label>
        <select [(ngModel)]="roleId"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option [value]="1">Admin</option>
          <option [value]="2">Manager</option>
          <option [value]="3">Employee</option>
        </select>
      </div>

      <div *ngIf="roleId == 3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Employee ID</label>
        <input type="number" [(ngModel)]="employeeId" placeholder="Enter your Employee ID"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <p class="text-xs text-gray-400 mt-1">Ask your Admin for your Employee ID</p>
      </div>

      <button (click)="onRegister()" [disabled]="isLoading"
        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg transition duration-200 disabled:opacity-50">
        {{ isLoading ? 'Registering...' : 'Register' }}
      </button>

      <p class="text-center text-sm text-gray-500">
        Already have an account?
        <a href="/login" class="text-blue-600 hover:underline font-medium">Login here</a>
      </p>
    </div>
  </div>
</div>
